monolog:
    channels:
        - deprecation
        - audit

    handlers:
        main:
            type: stream
            path: '%kernel.logs_dir%/%kernel.environment%.log'
            level: debug
            channels: ['!event', '!audit']

        audit:
            type: stream
            path: '%kernel.logs_dir%/audit.log'
            level: info
            channels: [audit]

        console:
            type: console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50

            nested:
                type: stream
                path: php://stderr
                level: debug

            audit:
                type: stream
                path: php://stderr
                level: info
                channels: [audit]
